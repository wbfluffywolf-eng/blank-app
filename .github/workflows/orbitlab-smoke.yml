name: OrbitLab smoke test
on:
  push:
    branches: [mee453-orbitlab]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r orbitlab/requirements.txt
      - name: Compile Python app
        run: python -m py_compile orbitlab/streamlit_app.py
      - name: Run Streamlit smoke test
        run: |
          streamlit run orbitlab/streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
